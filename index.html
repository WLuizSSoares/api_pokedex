<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <main>
        <section class="inicio">
            <h1>POKÉDEX</h1>
            <input type="text"
             id="nome"
             placeholder="Digite o nome do Pokémon!">
            <button type="button" id="buscar">Buscar</button>
        </section>
        <section class="principal">
            <div class="card">
                <p>Nome: <span id="pokemon-nome"></span> </p>
                <p>Número: <span id="pokemon-numero"></span></p>
                <p>Tipo: <span id="pokemon-tipo"></span></p>
                <p>Altura: <span id="pokemon-altura"></span> </p>
                <p>Peso: <span id="pokemon-peso"></span></p>
            </div>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
